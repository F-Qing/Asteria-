spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/finaltext?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    # 账号密码从环境变量读；没设置环境变量时用冒号后面的默认值（本地开发用）
    # 这样这个文件可以安全提交到 GitHub，不会泄露真实密码
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.asteria.server: debug